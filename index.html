<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARFUXXIA | Moda & Accesorios</title>
<meta name="description" content="STARFUXXIA — Tienda de ropa y accesorios. Encuentra tu próximo favorito.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rosa:#e8559a; --rosa-oscuro:#d13d84; --rosa-suave:#ffe3f0;
    --rosa-fondo:#fff6fa; --crema:#fffafd; --blanco:#ffffff;
    --negro:#1f161c; --texto:#2b1d25; --gris:#8a7882; --borde:#f2dce7;
    --verde:#25d366; --oferta:#16a34a;
    --sombra:0 8px 24px rgba(209,61,132,.10);
    --sombra-fuerte:0 12px 32px rgba(209,61,132,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{font-family:'Karla',sans-serif;background:var(--crema);color:var(--texto);line-height:1.55;padding-bottom:90px}
  h1,h2,h3,.marca,.precio{font-family:'Bricolage Grotesque',sans-serif}

  /* ---------- HEADER IGUAL AL TUYO ---------- */
  header{position:sticky;top:0;z-index:50;background:rgba(255,250,253,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--borde);padding:12px 16px}
  .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
  .logo-icono{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--rosa),var(--rosa-oscuro));display:flex;align-items:center;justify-content:center;box-shadow:var(--sombra)}
  .logo-icono svg{width:22px;height:22px;stroke:#fff;fill:#fff}
  .marca{font-size:20px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--rosa-oscuro),var(--rosa));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  .buscador{flex:1;display:flex;align-items:center;gap:8px;background:var(--rosa-suave);border-radius:14px;padding:10px 14px;min-width:0}
  .buscador svg{width:18px;height:18px;stroke:var(--rosa-oscuro);flex-shrink:0}
  .buscador input{border:none;background:transparent;outline:none;font-family:'Karla',sans-serif;font-size:14px;color:var(--texto);width:100%;min-width:0}
  .buscador input::placeholder{color:var(--gris)}
  .carrito-btn{flex-shrink:0;border:none;cursor:pointer;background:linear-gradient(135deg,var(--rosa),var(--rosa-oscuro));color:#fff;border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:7px;font-family:'Karla',sans-serif;font-weight:700;font-size:13px;box-shadow:var(--sombra);transition:transform .15s ease}
  .carrito-btn:active{transform:scale(.95)}
  .carrito-btn svg{width:20px;height:20px;stroke:#fff;fill:none}
  .carrito-num{background:rgba(255,255,255,.25);min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;padding:0 6px}

  .hero{max-width:1100px;margin:0 auto;padding:22px 16px 6px}
  .hero h1{font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.2;color:var(--texto)}
  .hero h1 .corazon{display:inline-block;color:var(--rosa);animation:latido 1.6s ease-in-out infinite}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .hero p{color:var(--gris);font-size:14px;margin-top:4px}

  .filtros{max-width:1100px;margin:0 auto;padding:14px 16px 6px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .filtros::-webkit-scrollbar{display:none}
  .filtro{flex-shrink:0;border:none;cursor:pointer;padding:9px 18px;border-radius:999px;font-family:'Karla',sans-serif;font-size:14px;font-weight:600;background:var(--blanco);color:var(--texto);border:1.5px solid var(--borde);transition:all .2s ease;display:flex;align-items:center;gap:6px}
  .filtro:active{transform:scale(.96)}
  .filtro.activo{background:var(--rosa-suave);color:var(--rosa-oscuro);border-color:var(--rosa)}
  .filtro.oferta{background:#e8f8ee;color:var(--oferta);border-color:#86efac}
  .filtro.oferta svg{width:16px;height:16px;fill:var(--oferta);stroke:none}

  .productos{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;align-items:start}
  .tarjeta{background:var(--blanco);border-radius:18px;overflow:hidden;border:1px solid var(--borde);box-shadow:0 2px 10px rgba(209,61,132,.06);transition:transform .25s ease, box-shadow .25s ease;display:flex;flex-direction:column}
  .tarjeta:hover{transform:translateY(-4px);box-shadow:var(--sombra-fuerte)}

  /* ⭐ EL FIX — IMAGEN COMPLETA SIN RECORTAR ⭐ */
  .foto{width:100%;background:var(--blanco);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .foto img{width:100%;height:auto;object-fit:contain;object-position:center;display:block}
  /* ⭐ FIN DEL FIX ⭐ */

  .foto-placeholder{width:100%;aspect-ratio:4/5;background:linear-gradient(160deg,#fff0f7,#ffe0ee 60%,#ffd0e6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--rosa-oscuro)}
  .foto-placeholder svg{width:44px;height:44px;stroke:var(--rosa);fill:none;opacity:.7}
  .foto-placeholder span{font-size:13px;font-weight:600;opacity:.8}

  .cuerpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .categoria{font-size:12px;font-weight:600;color:var(--rosa-oscuro);text-transform:uppercase;letter-spacing:.8px}
  .nombre{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700;color:var(--texto);line-height:1.25}
  .descripcion{font-size:13.5px;color:var(--gris);line-height:1.5}
  .detalles{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--rosa-fondo);color:var(--rosa-oscuro);border:1px solid var(--borde)}
  .precio-fila{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
  .precio{font-size:22px;font-weight:800;color:var(--rosa-oscuro)}
  .badge-oferta{font-size:11px;font-weight:700;color:#fff;background:var(--oferta);padding:3px 10px;border-radius:999px}
  .btn-agregar{margin-top:10px;width:100%;background:var(--negro);color:#fff;border:none;cursor:pointer;padding:13px;border-radius:14px;font-family:'Karla',sans-serif;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s ease}
  .btn-agregar:hover{background:#000;transform:translateY(-1px)}
  .btn-agregar:active{transform:scale(.97)}
  .btn-agregar svg{width:18px;height:18px;stroke:#fff;fill:none}
  .sin-resultados{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--gris)}

  .info-cards{max-width:1100px;margin:10px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .info-card{background:var(--rosa-suave);border-radius:16px;padding:18px;display:flex;gap:12px;align-items:flex-start;border:1px solid #f7c9dd}
  .info-card .icono{flex-shrink:0;width:40px;height:40px;border-radius:12px;background:var(--blanco);display:flex;align-items:center;justify-content:center}
  .info-card .icono svg{width:22px;height:22px;stroke:var(--rosa-oscuro);fill:none}
  .info-card h3{font-size:15px;font-weight:700;color:var(--texto)}
  .info-card p{font-size:13px;color:var(--gris);margin-top:2px}

  .whatsapp{position:fixed;bottom:24px;right:20px;z-index:60;display:flex;align-items:center;gap:8px;background:var(--verde);color:#fff;text-decoration:none;padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(37,211,102,.4);transition:transform .2s ease}
  .whatsapp:active{transform:scale(.95)}
  .whatsapp svg{width:22px;height:22px;fill:#fff}

  footer{max-width:1100px;margin:30px auto 0;padding:24px 16px;text-align:center;color:var(--gris);font-size:13px;border-top:1px solid var(--borde)}
  footer .marca-footer{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:var(--rosa-oscuro);font-size:16px}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--negro);color:#fff;padding:12px 22px;border-radius:14px;font-size:14px;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:all .3s ease;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;white-space:nowrap}
  .toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:18px;height:18px;stroke:var(--verde);fill:none}

  @media (max-width:520px){
    .marca{font-size:16px}
    .logo-icono{width:32px;height:32px;border-radius:10px}
    .carrito-btn{padding:7px 10px;font-size:12px;gap:5px}
    .carrito-btn svg{width:17px;height:17px}
    .carrito-num{min-width:19px;height:19px;font-size:11px}
    .productos{grid-template-columns:1fr 1fr;gap:12px;padding:12px}
    .nombre{font-size:15px}
    .descripcion{font-size:12.5px}
    .precio{font-size:18px}
    .btn-agregar{padding:11px;font-size:13px}
    .cuerpo{padding:10px 12px 12px}
    .whatsapp span{display:none}
    .whatsapp{padding:14px;border-radius:50%}
  }
</style>
</head>

</div>

<script>
/* ⭐ EDITA AQUÍ TUS PRODUCTOS — pega el enlace de tu foto en imagen: "" ⭐ */
var PRODUCTOS = [
  {nombre:"Vestido de baño de niña Evandra", precio:86900, categoria:"Vestidos de baño niña", descripcion:"Enterizo infantil de manga larga con cierre frontal. Diseño en rayas con estrellas y conchas marinas.", colores:"Azul, Rosa, Lila", tallas:"4-6-10-12", imagen:"", oferta:false},
  {nombre:"Bikini Strapless + Pareo", precio:95000, categoria:"Bikinis", descripcion:"Top sin tirantes con copas removibles + panty de pierna alta. Incluye pareo de malla manga larga.", colores:"Rosa/Celeste, Negro/Marfil", tallas:"32 a 56", imagen:"", oferta:true},
  {nombre:"Enterizo Escote Halter", precio:89000, categoria:"Enterizos", descripcion:"Enterizo halter con copa removible y escote en V. Degradado en tonos azul, amarillo y rosa.", colores:"Petróleo, Azul, Fucsia, Negro", tallas:"32 a 58", imagen:"", oferta:false},
  {nombre:"Bóxer Semilargo Unicolor", precio:32000, categoria:"Hombre", descripcion:"Bóxer semilargo 94% algodón 6% elastano. Ajuste perfecto, suave y fresco. Elástico anatómico.", colores:"Azul, Blanco, Negro, Rojo, Gris", tallas:"XS a XL", imagen:"", oferta:true},
  {nombre:"Enterizo Junior REF. 181", precio:78000, categoria:"Junior", descripcion:"Enterizo junior de manga larga con cordón en la espalda. Diseño en rayas blanco y rosa.", colores:"Rosa, Lila/Menta, Fucsia", tallas:"12 a 18", imagen:"", oferta:false},
  {nombre:"Conjunto Lycra Protección Solar", precio:110000, categoria:"Deportivo", descripcion:"Buzo de manga larga + biker. Protección solar, suave y cómodo. Ideal para playa y piscina.", colores:"Negro, Azul Oscuro, Azul Rey", tallas:"32 a 58", imagen:"", oferta:false}
];

function fmt(n){ return "$ " + n.toLocaleString("es-CO"); }
var contenedor = document.getElementById("productos");
var catActual = "todos";
var textoBusqueda = "";

function renderizar(){
  contenedor.innerHTML = "";
  var lista = PRODUCTOS.filter(function(p){
    var c = catActual === "todos" || (catActual === "ofertas" && p.oferta) || p.categoria.toLowerCase() === catActual.toLowerCase();
    var t = !textoBusqueda || (p.nombre+" "+p.descripcion+" "+p.categoria).toLowerCase().indexOf(textoBusqueda) !== -1;
    return c && t;
  });
  if(!lista.length){ contenedor.innerHTML = '<div class="sin-resultados">No encontramos productos. Prueba con otra búsqueda.</div>'; return; }
  lista.forEach(function(p){
    var tarjeta = document.createElement("article"); tarjeta.className = "tarjeta";
    var foto = document.createElement("div"); foto.className = "foto";
    var ph = '<div class="foto-placeholder"><svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 1-.99 1.14H2.75a1 1 0 0 0-1 1.15l.6 5.98a2 2 0 0 0 1.94 1.74h11.42a2 2 0 0 0 1.94-1.74l.6-5.98a1 1 0 0 0-1-1.15h-.87a1 1 0 0 1-.99-1.14l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg><span>Tu imagen aquí</span></div>';
    if(p.imagen && p.imagen.trim()!==""){
      var img = document.createElement("img"); img.src = p.imagen; img.alt = p.nombre; img.loading = "lazy";
      img.onerror = function(){ this.parentElement.innerHTML = ph; };
      foto.appendChild(img);
    } else { foto.innerHTML = ph; }
    tarjeta.appendChild(foto);

    var cuerpo = document.createElement("div"); cuerpo.className = "cuerpo";
    var cat = document.createElement("div"); cat.className="categoria"; cat.textContent=p.categoria; cuerpo.appendChild(cat);
    var nombre = document.createElement("h3"); nombre.className="nombre"; nombre.textContent=p.nombre; cuerpo.appendChild(nombre);
    var desc = document.createElement("p"); desc.className="descripcion"; desc.textContent=p.descripcion; cuerpo.appendChild(desc);
    var chips = document.createElement("div"); chips.className="detalles";
    if(p.colores){var c1=document.createElement("span");c1.className="chip";c1.textContent="Colores: "+p.colores;chips.appendChild(c1);}
    if(p.tallas){var c2=document.createElement("span");c2.className="chip";c2.textContent="Tallas: "+p.tallas;chips.appendChild(c2);}
    cuerpo.appendChild(chips);
    var pf=document.createElement("div"); pf.className="precio-fila";
    var pr=document.createElement("span"); pr.className="precio"; pr.textContent=fmt(p.precio); pf.appendChild(pr);
    if(p.oferta){var b=document.createElement("span");b.className="badge-oferta";b.textContent="OFERTA";pf.appendChild(b);}
    cuerpo.appendChild(pf);
    var btn=document.createElement("button"); btn.className="btn-agregar";
    btn.innerHTML='<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Añadir al carrito';
    btn.addEventListener("click",function(){ agregarAlCarrito(p.nombre); });
    cuerpo.appendChild(btn);
    tarjeta.appendChild(cuerpo);
    contenedor.appendChild(tarjeta);
  });
}

var carrito=0, carritoNum=document.getElementById("carritoNum"), toast=document.getElementById("toast"), toastTexto=document.getElementById("toastTexto"), toastTimer=null;
function agregarAlCarrito(nombre){
  carrito++; carritoNum.textContent=carrito;
  toastTexto.textContent=nombre+" añadido"; toast.classList.add("visible");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){toast.classList.remove("visible");},2200);
}
document.getElementById("carritoBtn").addEventListener("click",function(){
  toastTexto.textContent = carrito===0 ? "Tu carrito está vacío" : "Tienes "+carrito+" producto(s) — pídelos por WhatsApp";
  toast.classList.add("visible"); clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toast.classList.remove("visible");},2500);
});
document.getElementById("filtros").addEventListener("click",function(e){
