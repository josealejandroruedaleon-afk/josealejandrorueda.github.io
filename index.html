<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STARFUXXIA | Moda & Accesorios</title>

<style>
:root{
  --pink:#e96f9d;
  --pink2:#ffb7d2;
  --dark:#211b20;
  --cream:#fff8fb;
  --line:#f0d7e2;
  --green:#25d366;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  color:var(--dark);
  background:#fff;
}

a{
  text-decoration:none;
  color:inherit;
}

button,input{
  font:inherit;
}

/* BARRA SUPERIOR */
.top{
  background:#211b20;
  color:#fff;
  text-align:center;
  padding:8px;
  font-size:12px;
  letter-spacing:.5px;
}

/* NAV */
header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:16px 24px;
  display:flex;
  align-items:center;
  gap:25px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:22px;
  letter-spacing:1px;
  color:var(--pink);
}

.logo-mark{
  width:40px;
  height:40px;
  border-radius:13px;
  background:linear-gradient(135deg,#fff,#ffb1d0);
  display:grid;
  place-items:center;
  color:#fff;
  box-shadow:0 5px 18px #e96f9d55;
}

.links{
  display:flex;
  gap:20px;
  margin-left:auto;
  font-size:14px;
  font-weight:700;
}

.links a:hover{
  color:var(--pink);
}

.search{
  position:relative;
}

.search input{
  width:190px;
  border:1px solid var(--line);
  border-radius:25px;
  padding:10px 14px 10px 38px;
  outline:none;
}

.search span{
  position:absolute;
  left:13px;
  top:9px;
}

.cart{
  border:0;
  background:var(--pink);
  color:#fff;
  border-radius:25px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
}

/* PORTADA */
.hero{
  background:
    radial-gradient(circle at 75% 20%,#ffd9e8,transparent 32%),
    linear-gradient(120deg,#fff,#fff1f6);

  min-height:530px;

  display:grid;
  grid-template-columns:1.05fr .95fr;
  align-items:center;
}

.hero-copy{
  max-width:1200px;
  margin:auto;
  padding:70px 24px;
}

.eyebrow{
  color:var(--pink);
  font-weight:900;
  letter-spacing:2px;
  font-size:13px;
}

.hero h1{
  font-size:clamp(46px,7vw,84px);
  line-height:.95;
  margin:15px 0;
}

.hero h1 span{
  color:var(--pink);
}

.hero p{
  max-width:500px;
  color:#70666c;
  font-size:18px;
  line-height:1.6;
}

.cta{
  display:inline-block;
  background:var(--dark);
  color:#fff;
  padding:14px 22px;
  border-radius:30px;
  font-weight:800;
  margin-top:12px;
}

.hero-art{
  height:100%;
  min-height:450px;
  display:grid;
  place-items:center;
  padding:35px;
}

.hero-card{
  width:min(390px,90%);
  height:410px;
  border-radius:35px;

  background:
    linear-gradient(145deg,#fff,#ffd5e5);

  box-shadow:0 25px 60px #c95a8730;

  display:grid;
  place-items:center;
  font-size:130px;
}

/* CONTENIDO */
main{
  max-width:1200px;
  margin:auto;
  padding:60px 24px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}

.section-head h2{
  font-size:32px;
  margin:0;
}

.section-head p{
  color:#80757b;
}

/* CATEGORÍAS */
.categories{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:35px;
}

.cat{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 16px;
  border-radius:25px;
  cursor:pointer;
}

.cat.active,
.cat:hover{
  background:#ffe3ee;
  border-color:#ffc3d7;
  color:#b83769;
  font-weight:800;
}

/* PRODUCTOS */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.product{
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  background:#fff;
  transition:.2s;
}

.product:hover{
  transform:translateY(-4px);
  box-shadow:0 15px 35px #5a20320d;
}

.pic{
  height:270px;
  background:#fff0f6;
  overflow:hidden;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.info{
  padding:16px;
}

.info h3{
  margin:0 0 6px;
  font-size:17px;
}

.meta{
  font-size:12px;
  color:#93878d;
}

.specs{
  margin:12px 0 14px;
  padding-top:12px;
  border-top:1px solid var(--line);
  font-size:12px;
  line-height:1.55;
  color:#756970;
}

.specs b{
  color:var(--dark);
}

.spec-title{
  display:block;
  color:var(--pink);
  font-weight:900;
  margin-bottom:5px;
  font-size:13px;
}

.specs span{
  display:block;
}

.price{
  font-weight:900;
  font-size:20px;
  color:var(--pink);
  margin:11px 0;
}

.add{
  width:100%;
  border:0;
  background:#211b20;
  color:#fff;
  padding:12px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.add:hover{
  background:var(--pink);
}

/* INFORMACIÓN */
.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:55px;
}

.feature{
  background:var(--cream);
  padding:24px;
  border:1px solid var(--line);
  border-radius:20px;
}

.feature b{
  display:block;
  margin-bottom:6px;
}

.feature span{
  color:#776c72;
  font-size:14px;
}

/* FOOTER */
footer{
  background:#211b20;
  color:#fff;
  padding:45px 24px;
}

.footer-in{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:30px;
  flex-wrap:wrap;
}

.footer-logo{
  font-weight:900;
  color:#ffb2ce;
  font-size:22px;
}

.footer-in p{
  color:#c9c0c5;
  font-size:14px;
}

/* WHATSAPP */
.wa{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:25;

  background:var(--green);
  color:#fff;

  padding:14px 19px;
  border-radius:50px;

  font-weight:900;

  box-shadow:0 12px 30px #25d36655;

  display:flex;
  gap:9px;
  align-items:center;
}

/* RESPONSIVE */
@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero{
    grid-template-columns:1fr;
  }

  .hero-art{
    display:none;
  }

  .links{
    display:none;
  }

  .features{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  .nav{
    padding:12px 15px;
    gap:10px;
  }

  .logo{
    font-size:17px;
  }

  .logo-mark{
    width:34px;
    height:34px;
  }

  .search{
    display:none;
  }

  .cart{
    margin-left:auto;
  }

  .grid{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .pic{
    height:210px;
  }

  .info{
    padding:12px;
  }

  .info h3{
    font-size:14px;
  }

  .price{
    font-size:17px;
  }

  main{
    padding:45px 15px;
  }

  .hero-copy{
    padding:55px 20px;
  }

  .hero h1{
    font-size:54px;
  }

}
</style>
</head>

<body>
<!-- Botones de Sesión -->
<div style="text-align: right; margin: 20px 30px;">
  <button onclick="iniciarSesionGoogle()" id="btn-google" style="background: linear-gradient(135deg, #4285F4, #34a853, #fbbc05, #ea4335); color: white; border: none; padding: 14px 28px; font-size: 17px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4); transition: all 0.3s ease;">
    🔐 Iniciar sesión con Google
  </button>
  <button onclick="cerrarSesion()" id="btn-cerrar" style="display:none; background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: none; padding: 12px 24px; font-size: 15px; font-weight: bold; border-radius: 50px; cursor: pointer; margin-left: 10px; box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);">
    🚪 Cerrar sesión
  </button>
  <span id="usuario-nombre" style="margin-left:15px; color:#333; font-weight:500;"></span>
</div>

<!-- Panel de Administrador -->
<div id="admin-panel" style="display:none; max-width: 500px; margin: 30px auto; padding: 30px; background: linear-gradient(135deg, #f0b000, #ffcc00); border-radius: 16px; box-shadow: 0 8px 30px rgba(255, 196, 0, 0.4);">
  <h2 style="text-align:center; color:#2d2d2d; margin-top:0;">⚙️ Agregar Producto</h2>
  <input type="text" id="prod-nombre" placeholder="📦 Nombre del producto" style="width:100%; padding:12px; margin:8px 0; border:none; border-radius:8px; font-size:15px; box-sizing:border-box;">
  <textarea id="prod-desc" placeholder="📝 Descripción" style="width:100%; padding:12px; margin:8px 0; border:none; border-radius:8px; font-size:15px; min-height:100px; box-sizing:border-box;"></textarea>
  <input type="number" id="prod-precio" placeholder="💰 Precio" style="width:100%; padding:12px; margin:8px 0; border:none; border-radius:8px; font-size:15px; box-sizing:border-box;">
  <button onclick="guardarProducto()" style="width:100%; background: linear-gradient(135deg, #27ae60, #2ecc71); color:white; border:none; padding:14px; font-size:17px; font-weight:bold; border-radius:8px; cursor:pointer; margin-top:10px; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);">
    ✅ Guardar Producto
  </button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC5bXz9wCjVhCxH8KdC9sYb6dX7c8Z9X7c8Z9X7c8Z9",
  authDomain: "starfuxxia-987dd.firebaseapp.com",
  databaseURL: "https://starfuxxia-987dd-default-rtdb.firebaseio.com",
  projectId: "starfuxxia-987dd",
  storageBucket: "starfuxxia-987dd.appspot.com",
  messagingSenderId: "154113912493",
  appId: "1:154113912493:web:90a46479c921ee0b1e8b24"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function iniciarSesionGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then((result) => {
      mostrarUsuario(result.user);
    })
    .catch((error) => {
      alert("Error: " + error.message);
    });
}

function cerrarSesion() {
  auth.signOut().then(() => {
    document.getElementById('usuario-nombre').textContent = '';
    document.getElementById('btn-google').style.display = 'block';
    document.getElementById('btn-cerrar').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'none';
  });
}

function mostrarUsuario(user) {
  document.getElementById('usuario-nombre').textContent = user.email;
  document.getElementById('btn-google').style.display = 'none';
  document.getElementById('btn-cerrar').style.display = 'inline-block';
  if (user.email === 'josealejandroruedaleon@gmail.com') {
    document.getElementById('admin-panel').style.display = 'block';
  }
}

function guardarProducto() {
  const nombre = document.getElementById('prod-nombre').value;
  const desc = document.getElementById('prod-desc').value;
  const precio = document.getElementById('prod-precio').value;
  
  if (!nombre || !precio) { alert('Completa nombre y precio'); return; }
  
  db.collection('productos').add({
    nombre: nombre,
    descripcion: desc,
    precio: parseFloat(precio),
    fecha: new Date()
  }).then(() => {
    alert('✅ Producto guardado!');
    document.getElementById('prod-nombre').value = '';
    document.getElementById('prod-desc').value = '';
    document.getElementById('prod-precio').value = '';
  }).catch((error) => {
    alert('Error: ' + error.message);
  });
}

auth.onAuthStateChanged((user) => {
  if (user) { mostrarUsuario(user); }
});
</script>
</html>
